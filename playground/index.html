<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ztore Playground</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='2'%3E%3Cpath d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/%3E%3Cpath d='m3.3 7 8.7 5 8.7-5'/%3E%3Cpath d='M12 22V12'/%3E%3C/svg%3E">
</head>
<body class="flex flex-col h-screen overflow-hidden bg-gray-950 text-gray-100 font-sans">

<!-- HEADER -->
<header class="flex items-center justify-between px-4 py-2.5 border-b border-gray-800 shrink-0 bg-gray-900">
  <div class="flex items-center gap-2">
    <i data-lucide="box" class="w-5 h-5 text-blue-400"></i>
    <span class="font-bold text-base"><span class="text-blue-400">ztore</span> Playground</span>
    <span class="text-xs px-2 py-0.5 rounded-full bg-gray-800 text-gray-400">v1.0</span>
    <span class="text-xs text-gray-500">138 lines &middot; zero deps</span>
  </div>
  <button id="clearAll" class="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-400 hover:text-gray-300 transition">
    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset
  </button>
</header>

<!-- MAIN -->
<div class="flex flex-1 overflow-hidden">

  <!-- LEFT: EDITOR -->
  <div class="flex flex-col flex-1 min-w-0 border-r border-gray-800">
    <div class="flex items-center gap-2 px-3 py-2 border-b border-gray-800 shrink-0 bg-gray-900">
      <select id="exampleSelect" class="text-xs px-2.5 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-200 cursor-pointer outline-none">
        <option value="counter">1. Counter</option>
        <option value="todo">2. Todo List</option>
        <option value="auth">3. User Auth</option>
        <option value="cart">4. Shopping Cart</option>
        <option value="game">5. Game Health</option>
        <option value="chat">6. Chat Room</option>
        <option value="agent" selected>7. AI Agent</option>
        <option value="form">8. Form State</option>
        <option value="pubsub">9. Pub/Sub Bus</option>
        <option value="undo">10. Undo/Redo</option>
        <option value="pagination">11. Pagination</option>
        <option value="state-machine">12. State Machine</option>
      </select>
      <button id="runBtn" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg text-white border border-green-700 bg-green-700 hover:bg-green-600 transition">
        <i data-lucide="play" class="w-3.5 h-3.5"></i> Run
      </button>
      <label class="flex items-center gap-1.5 text-xs cursor-pointer select-none text-gray-400">
        <input type="checkbox" id="autoRun" checked class="rounded accent-green-500">
        Auto-run
      </label>
      <button id="clearOutput" class="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded-lg border border-gray-700 bg-gray-800 text-gray-400 hover:text-red-400 transition">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
      </button>
    </div>
    <div class="flex-1 overflow-hidden" id="editor-container" style="height:100%"></div>
  </div>

  <!-- RIGHT: OUTPUT -->
  <div class="flex flex-col shrink-0" style="width:480px;min-width:320px;max-width:50%">

    <!-- TABS -->
    <div class="flex border-b border-gray-800 shrink-0 bg-gray-900">
      <button class="tab-btn flex items-center gap-1.5 px-4 py-2.5 text-xs font-medium border-b-2 transition cursor-pointer text-gray-400 border-transparent hover:text-gray-200" data-tab="console">
        <i data-lucide="terminal" class="w-3.5 h-3.5"></i> Console
      </button>
      <button class="tab-btn flex items-center gap-1.5 px-4 py-2.5 text-xs font-medium border-b-2 transition cursor-pointer text-blue-400 border-blue-400" data-tab="state">
        <i data-lucide="database" class="w-3.5 h-3.5"></i> State
      </button>
      <button class="tab-btn flex items-center gap-1.5 px-4 py-2.5 text-xs font-medium border-b-2 transition cursor-pointer text-gray-400 border-transparent hover:text-gray-200" data-tab="events">
        <i data-lucide="zap" class="w-3.5 h-3.5"></i> Events
      </button>
    </div>

    <!-- PANELS -->
    <div class="flex-1 overflow-auto font-mono text-xs">

      <div class="panel hidden flex-col h-full" id="panel-console">
        <div id="consoleOutput" class="flex-1 overflow-auto"></div>
        <div id="consoleEmpty" class="flex flex-col items-center justify-center h-full text-gray-500">
          <i data-lucide="terminal" class="w-8 h-8 mb-2 opacity-30"></i>
          <span class="text-sm">Output appears here</span>
        </div>
      </div>

      <div class="panel flex-col h-full" id="panel-state">
        <div id="stateOutput" class="flex-1 overflow-auto p-2"></div>
        <div id="stateEmpty" class="flex flex-col items-center justify-center h-full text-gray-500">
          <i data-lucide="database" class="w-8 h-8 mb-2 opacity-30"></i>
          <span class="text-sm">No stores created</span>
        </div>
      </div>

      <div class="panel hidden flex-col h-full" id="panel-events">
        <div id="eventOutput" class="flex-1 overflow-auto p-2"></div>
        <div id="eventEmpty" class="flex flex-col items-center justify-center h-full text-gray-500">
          <i data-lucide="zap" class="w-8 h-8 mb-2 opacity-30"></i>
          <span class="text-sm">No events emitted</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- STATUSBAR -->
<div class="flex items-center justify-between px-4 py-1.5 border-t border-gray-800 shrink-0 text-xs bg-gray-900 text-gray-500">
  <span id="statusText">Ready</span>
  <div class="flex items-center gap-4">
    <span class="flex items-center gap-1.5">
      <span id="statusDot" class="w-2 h-2 rounded-full inline-block bg-gray-600"></span>
      <span id="storeCount">0</span> stores
    </span>
    <span class="flex items-center gap-1">
      <i data-lucide="git-commit" class="w-3 h-3"></i>
      <span id="updateCount">0</span>
    </span>
    <span class="flex items-center gap-1">
      <i data-lucide="activity" class="w-3 h-3"></i>
      <span id="eventCount">0</span>
    </span>
    <span class="flex items-center gap-1">
      <i data-lucide="code" class="w-3 h-3"></i>
      <span id="ztoreSize">138</span> lines
    </span>
  </div>
</div>

<script type="module" src="./js/ui.js"></script>
</body>
</html>
